name: Update daily podcast

on:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/daily-update.yml"
  schedule:
    - cron: "30 14 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-podcast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: pip install -r requirements.txt
      - name: Fetch and process the newest episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSCRIPTION_MAX_SECONDS: "20"
        run: |
          set +e
          python scripts/update_podcast.py 2>&1 | tee /tmp/podcast-update.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 1 /tmp/podcast-update.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Podcast update failed::$message"
            exit "$status"
          fi
      - name: Commit generated notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "content: add latest learning notes"
          git push
