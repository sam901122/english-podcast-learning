name: Update daily podcast

on:
  schedule:
    - cron: "0 8 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-podcast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and process the newest episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSCRIPTION_MODEL: gemini-3.6-flash
          ANALYSIS_MODEL: gemini-3.6-flash
          WORD_FORM_MODEL: gemini-3.5-flash-lite
        run: |
          set +e
          python scripts/update_podcast.py 2>&1 | tee /tmp/podcast-update.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 1 /tmp/podcast-update.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Podcast update failed::$message"
            exit "$status"
          fi
      - name: Commit generated notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "content: add latest learning notes"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
