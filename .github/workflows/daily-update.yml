name: Update daily podcast

on:
  schedule:
    - cron: "5 6,8 * * 2-6"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-podcast-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.podcast.outputs.updated }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify Gemini secrets are configured
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
        run: |
          test -n "$GEMINI_FREE_API_KEY" || { echo "::error::GEMINI_FREE_API_KEY is missing"; exit 1; }
          test -n "$GEMINI_PAID_API_KEY" || { echo "::error::GEMINI_PAID_API_KEY is missing"; exit 1; }
          echo "Both Gemini secrets are configured."
      - name: Fetch and process the newest episode
        id: podcast
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          TRANSCRIPTION_MODEL: gemini-3.6-flash
          ANALYSIS_MODEL: gemini-3.6-flash
          WORD_FORM_MODEL: gemini-3.6-flash
        run: |
          set +e
          python scripts/update_podcast.py 2>&1 | tee /tmp/podcast-update.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 1 /tmp/podcast-update.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Podcast update failed::$message"
            exit "$status"
          fi
          if [ -n "$(git status --porcelain -- site/data)" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated notes
        if: steps.podcast.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "content: add latest learning notes"
          git push
      - name: Configure GitHub Pages
        if: steps.podcast.outputs.updated == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        if: steps.podcast.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.updated == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
